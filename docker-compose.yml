version: '3'

volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13.10
    env_file: .env.example
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend/
    env_file: .env.example
    volumes:
      - static:/backend_static
      - media:/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend/
    env_file: .env.example
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static

  gateway:
    build: ./nginx/
    env_file: .env.example
    volumes:
      - static:/staticfiles
      - media:/media
    ports:
      - "9000:80"
    depends_on:
      - backend
      - frontend
